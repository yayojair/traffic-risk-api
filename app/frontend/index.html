<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Traffic Risk API</title>
</head>
<body>
    <h1>🚦 API de riesgo de tráfico</h1>
    <form class="d-flex" role="search" id="form-btn-risk">
        <input id="address-risk" class="form-control me-2" type="text" placeholder="Ejemplo: Calle República de Uruguay, Centro, Roma, Ciudad de México, Cuauhtémoc, Ciudad de México, 06060, México" aria-label="Search"/>
        <button  class="btn btn-outline-success" type="submit">Buscar</button>
    </form>
    <small class="text-muted">
        Formato recomendado: Vía pública / Vialidad, Colonia, Alcaldía, Entidad Federativa, Código Postal, Pais
    </small>

    <div id="loading-screen" class="overlay hidden">
        <div class="spinner">
            <div id = "circle-red" class="circle"></div>
            <div id = "circle-yellow" class="circle"></div>
            <div id = "circle-green" class="circle"></div>        
        </div>
        <p>Analizando riesgo...</p>
    </div>

    <div id="show-error" class="overlay hidden">
        <div class="container-error"> 
            
            <div class="error-icon">✕</div>
            <div class="error-content">
                <h3>Hubo un problema</h3>
                <p id="text-error"></p>
            </div>
        </div>
    </div>

    <div id="map"></div>
    
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script src="js/notification.js"></script>
    <script src="js/loading.js"></script>
    <script src="js/search.js"></script>
    <script src="js/api.js"></script>
    <script src="js/marker.js"></script>
    <script src="js/map.js"></script>
    <script src="js/app.js"></script>
    
</body>
</html>
