<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traffic Risk API</title>
    
    <link rel="preconnect" href="https://unpkg.com">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>

    <main class="container py-4">
        
        <header class="mb-4">
            <h1 class="fw-bold text-slate-800">🚦 API de riesgo de tráfico</h1>
        </header>

        <section class="search-section mb-4">
            <form class="d-flex gap-2" role="search" id="form-btn-risk">
                <input id="address-risk" 
                       class="form-control" 
                       type="text" 
                       placeholder="Ingresa una dirección (Ej: Calle República de Uruguay, Centro...)" 
                       aria-describedby="search-help"
                       required />
                <button class="btn btn-success " type="submit">Buscar</button>
            </form>
            <div id="search-help" class="form-text mt-2 text-muted">
                <strong>Formato recomendado:</strong> Vía pública / Vialidad, Colonia, Alcaldía, Entidad Federativa, Código Postal, País.
            </div>
        </section>

        <section class="map-section">
            <div id="map" class="rounded-3 shadow-sm"></div>
        </section>

        <section class="legend-risk-section">
            <div class="legend-title">
                <h2 class="h6 m-0 fw-bold text-secondary">Leyenda de riesgo</h2>
            </div>
            
            <ul class="legend-risk" aria-label="Niveles de riesgo de tráfico">
                <li><img class="legend-marker-icon" src="/static/images/marker-icon-red.png" alt="marcador rojo"> Alto</li>
                <li><img class="legend-marker-icon" src="/static/images/marker-icon-orange.png" alt="marcador naranja"> Moderado alto</li>
                <li><img class="legend-marker-icon" src="/static/images/marker-icon-yellow.png" alt="marcador amarillo"> Moderado bajo</li>
                <li><img class="legend-marker-icon" src="/static/images/marker-icon-green.png" alt="marcador verde"> Bajo/Nulo</li>
            </ul>
                        
            <div class="legend-ghost" aria-hidden="true"></div>
        </section>

    </main>

    <div id="loading-screen" class="overlay hidden" aria-live="assertive" aria-hidden="true">
        <div class="spinner mb-3">
            <div id="circle-red" class="circle"></div>
            <div id="circle-yellow" class="circle"></div>
            <div id="circle-green" class="circle"></div>        
        </div>
        <p class="fw-semibold text-white">Evaluando condiciones de riesgo...</p>
    </div>

    <div id="show-error" class="overlay hidden" role="alert" aria-hidden="true">
        <div class="container-error"> 
            <div class="error-icon">✕</div>
            <div class="error-content">
                <h3>Hubo un problema</h3>
                <p id="text-error"></p>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
   
    <script src="/static/js/notification.js"></script>
    <script src="/static/js/loading.js"></script>
    <script src="/static/js/api.js"></script>
    <script src="/static/js/marker.js"></script>
    <script src="/static/js/map.js"></script>
    <script defer src="/static/js/search.js"></script>

    <script src="/static/js/app.js"></script>
    
</body>
</html>
